name: Build FastGithub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: Restore dependencies
      run: dotnet restore FastGithub/FastGithub.csproj

    - name: Build
      run: dotnet build FastGithub/FastGithub.csproj --no-restore --configuration Release

    # 仓库暂无测试项目；新增测试工程后可恢复 dotnet test

  build-multi-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            artifact-name: fastgithub-linux-x64
          - os: windows-latest
            runtime: win-x64
            artifact-name: fastgithub-win-x64
          - os: macos-latest
            runtime: osx-x64
            artifact-name: fastgithub-osx-x64

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    # Linux/macOS 无法构建 net45 + WPF 的 FastGithub.UI，因此只构建主程序
    - name: Build for ${{ matrix.os }}
      shell: bash
      run: |
        if [ "${{ matrix.runtime }}" == "win-x64" ]; then
          dotnet build FastGithub.sln --configuration Release
        else
          dotnet build FastGithub/FastGithub.csproj --configuration Release
        fi

    - name: Publish single-file artifacts with UI
      shell: bash
      run: |
        # 发布主程序
        dotnet publish FastGithub/FastGithub.csproj \
          -c Release \
          -r ${{ matrix.runtime }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true \
          -o ./publish/${{ matrix.runtime }}

        # 发布 UI (仅 Windows)
        if [ "${{ matrix.runtime }}" == "win-x64" ]; then
          dotnet publish FastGithub.UI/FastGithub.UI.csproj \
            -c Release \
            -o ./publish/${{ matrix.runtime }}
        fi

    - name: Build installers (Windows only, EXE + MSI)
      if: matrix.runtime == 'win-x64'
      shell: pwsh
      run: |
        choco install innosetup wixtoolset --no-progress -y
        $version = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
        $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
        $wixBin = (Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe" | Select-Object -First 1).DirectoryName
        $publishDir = (Resolve-Path ./publish/win-x64).Path
        $iconPath = (Resolve-Path ./FastGithub.UI/app.ico).Path
        New-Item -ItemType Directory -Force -Path ./dist | Out-Null

        # 1) EXE 安装包（Inno Setup）
        & $iscc "/DMyAppVersion=$version" "installer\FastGithub.iss"
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

        # 2) MSI 安装包（WiX v3：heat 采集 -> candle 编译 -> light 链接）
        & "$wixBin\heat.exe" dir $publishDir -cg PublishFiles -dr INSTALLFOLDER -gg -g1 -sfrag -srd -sreg -var var.SourceDir -out .\dist\PublishFiles.wxs
        if ($LASTEXITCODE -ne 0) { throw "heat 采集失败" }
        & "$wixBin\candle.exe" -arch x64 "-dVersion=$version" "-dSourceDir=$publishDir" "-dIconPath=$iconPath" -out .\dist\ .\installer\FastGithub.wxs .\dist\PublishFiles.wxs
        if ($LASTEXITCODE -ne 0) { throw "candle 编译失败" }
        & "$wixBin\light.exe" -out ".\dist\FastGithub-$version-win-x64.msi" .\dist\FastGithub.wixobj .\dist\PublishFiles.wixobj
        if ($LASTEXITCODE -ne 0) { throw "light 链接失败" }

        Get-ChildItem ./dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ./publish/${{ matrix.runtime }}

    - name: Upload installers
      if: matrix.runtime == 'win-x64'
      uses: actions/upload-artifact@v4
      with:
        name: fastgithub-win-x64-installer
        path: |
          ./dist/*.exe
          ./dist/*.msi
