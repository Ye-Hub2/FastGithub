name: Build FastGithub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: Restore dependencies
      run: dotnet restore FastGithub/FastGithub.csproj

    - name: Build
      run: dotnet build FastGithub/FastGithub.csproj --no-restore --configuration Release

    # 仓库暂无测试项目；新增测试工程后可恢复 dotnet test

  build-multi-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-x64

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    # Linux/macOS 无法构建 net45 + WPF 的 FastGithub.UI，因此只构建主程序
    - name: Resolve version
      id: version
      shell: pwsh
      run: |
        $version = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
        "value=$version" >> $env:GITHUB_OUTPUT

    - name: Build for ${{ matrix.os }}
      shell: bash
      run: |
        if [ "${{ matrix.runtime }}" == "win-x64" ]; then
          dotnet build FastGithub.sln --configuration Release
        else
          dotnet build FastGithub/FastGithub.csproj --configuration Release
        fi

    - name: Publish single-file artifacts with UI
      shell: bash
      run: |
        # 发布主程序
        dotnet publish FastGithub/FastGithub.csproj \
          -c Release \
          -r ${{ matrix.runtime }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:PublishTrimmed=true \
          -o ./publish/${{ matrix.runtime }}

        # 发布 UI (仅 Windows)
        if [ "${{ matrix.runtime }}" == "win-x64" ]; then
          dotnet publish FastGithub.UI/FastGithub.UI.csproj \
            -c Release \
            -o ./publish/${{ matrix.runtime }}
        fi

    - name: Build installer (Windows only, EXE)
      if: matrix.runtime == 'win-x64'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        function Invoke-Step([string]$label, [scriptblock]$action) {
          Write-Host "=== $label ==="
          $output = & $action 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            $tail = ($output.Trim() -replace "`r?`n", ' | ')
            if ($tail.Length -gt 900) { $tail = $tail.Substring($tail.Length - 900) }
            if ($tail.Length -eq 0) { $tail = '(无输出)' }
            Write-Host "::error title=$label 失败 (exit $LASTEXITCODE)::$tail"
            exit 1
          }
        }

        Invoke-Step '安装 innosetup' { choco install innosetup --no-progress -y }

        $version = (Select-String -Path Directory.Build.props -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
        $iscc = (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        if (-not $iscc) { Write-Host '::error title=未找到 ISCC.exe::Inno Setup 未按预期安装到 Program Files (x86)'; exit 1 }
        if (-not (Test-Path ./publish/win-x64)) { Write-Host '::error title=发布目录缺失::./publish/win-x64 不存在，无法打包'; exit 1 }
        New-Item -ItemType Directory -Force -Path ./dist | Out-Null

        Invoke-Step 'EXE 安装包 (Inno Setup)' { & $iscc "/DMyAppVersion=$version" "installer\FastGithub.iss" }
        Get-ChildItem ./dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fastgithub-${{ steps.version.outputs.value }}-${{ matrix.runtime }}
        path: ./publish/${{ matrix.runtime }}

    - name: Upload installers
      if: matrix.runtime == 'win-x64'
      uses: actions/upload-artifact@v4
      with:
        name: fastgithub-${{ steps.version.outputs.value }}-win-x64-installer
        path: ./dist/*.exe
